name: Publish live demo

# Builds the browser-only demo (VITE_DEMO=1) and publishes it to GitHub Pages
# on every push to main. The full server version is run with `npm start`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w client
        env:
          VITE_DEMO: '1'
      - run: cp client/dist-demo/index.html client/dist-demo/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
